name: Deploy PriceLens frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Add public Supabase configuration
        run: |
          printf '%s\n' \
            'window.PRICE_LENS_CONFIG = {' \
            '  url: "${{ vars.SUPABASE_PUBLIC_URL }}",' \
            '  anonKey: "${{ vars.SUPABASE_PUBLIC_ANON_KEY }}",' \
            '};' > frontend/config.js

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
