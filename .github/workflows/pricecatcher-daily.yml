name: PriceCatcher daily update

on:
  workflow_dispatch:
  schedule:
    # 02:30 Malaysia time (UTC+8), after the source's daily refresh window.
    - cron: "30 18 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Load recent PriceCatcher summaries
        run: python -m pipeline.cli daily-summary
